spring.application.name=notification-service
server.port=8085

spring.config.import=optional:configserver:http://localhost:8888
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Base de données — trace des notifications envoyées
spring.datasource.url=jdbc:mysql://localhost:3306/smartorienta_notification?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Courtier de messages
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=notification-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# Messagerie
spring.mail.host=localhost
spring.mail.port=1026

# Service d'authentification, pour obtenir l'adresse des destinataires
auth-service.url=http://localhost:8081

spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=com.smartorienta.notificationservice.dto.DecisionEvent