version: '3.8'

services:

  # BASE DE DONNÉES
  mysql:
    image: mysql:8.0
    container_name: mysql-orientation
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: orientation_db
      MYSQL_USER: orientation_user
      MYSQL_PASSWORD: orientation_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - orientation-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # CACHE
  redis:
    image: redis:7-alpine
    container_name: redis-orientation
    ports:
      - "6379:6379"
    networks:
      - orientation-network

  # KAFKA + ZOOKEEPER
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    networks:
      - orientation-network

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka-orientation
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - orientation-network

  # EUREKA SERVER
  eureka-server:
    build: ./services/eureka-server
    container_name: eureka-server
    ports:
      - "8761:8761"
    networks:
      - orientation-network

  # CONFIG SERVER
  config-server:
    build: ./services/config-server
    container_name: config-server
    ports:
      - "8888:8888"
    depends_on:
      - eureka-server
    networks:
      - orientation-network

  # API GATEWAY
  api-gateway:
    build: ./services/api-gateway
    container_name: api-gateway
    ports:
      - "8080:8080"
    depends_on:
      - eureka-server
      - config-server
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    networks:
      - orientation-network

  # AUTH SERVICE
  auth-service:
    build: ./services/auth-service
    container_name: auth-service
    ports:
      - "8081:8081"
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_started
      redis:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/orientation_db
      SPRING_DATASOURCE_USERNAME: orientation_user
      SPRING_DATASOURCE_PASSWORD: orientation_pass
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_REDIS_HOST: redis
    networks:
      - orientation-network

  # STUDENT SERVICE
  student-service:
    build: ./services/student-service
    container_name: student-service
    ports:
      - "8082:8082"
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/orientation_db
      SPRING_DATASOURCE_USERNAME: orientation_user
      SPRING_DATASOURCE_PASSWORD: orientation_pass
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    networks:
      - orientation-network

  # ML SERVICE (FASTAPI)
  ml-service:
    build: ./services/ml-service
    container_name: ml-service
    ports:
      - "8084:8084"
    depends_on:
      - eureka-server
    networks:
      - orientation-network

  # ORIENTATION SERVICE
  orientation-service:
    build: ./services/orientation-service
    container_name: orientation-service
    ports:
      - "8083:8083"
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_started
      ml-service:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/orientation_db
      SPRING_DATASOURCE_USERNAME: orientation_user
      SPRING_DATASOURCE_PASSWORD: orientation_pass
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      ML_SERVICE_URL: http://ml-service:8084
    networks:
      - orientation-network

  # NOTIFICATION SERVICE
  notification-service:
    build: ./services/notification-service
    container_name: notification-service
    ports:
      - "8085:8085"
    depends_on:
      - kafka
      - eureka-server
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    networks:
      - orientation-network

  # FRONTEND NEXT.JS
  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "3000:3000"
    depends_on:
      - api-gateway
    environment:
      NEXT_PUBLIC_API_URL: http://api-gateway:8080
    networks:
      - orientation-network

# VOLUMES
volumes:
  mysql_data:

# NETWORK
networks:
  orientation-network:
    driver: bridge