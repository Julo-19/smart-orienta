name: Intégration continue

# Déclenché à chaque envoi sur les branches principales,
# ainsi qu'à l'ouverture d'une demande de fusion.
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:

  # ── Services Spring Boot ──
  # Chaque service est compilé et testé indépendamment : l'échec de
  # l'un n'empêche pas de connaître l'état des autres.
  backend:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - eureka-server
          - config-server
          - api-gateway
          - auth-service
          - student-service
          - orientation-service
          - notification-service

    steps:
      - name: Récupération du code
        uses: actions/checkout@v5

      - name: Installation de Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Compilation et tests
        working-directory: services/${{ matrix.service }}
        run: mvn --batch-mode verify

  # ── Interface utilisateur ──
  frontend:
    name: frontend
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code
        uses: actions/checkout@v5

      - name: Installation de Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installation des dépendances
        working-directory: frontend
        run: npm ci

      - name: Construction
        working-directory: frontend
        run: npm run build

  # ── Module de prédiction ──
  ml:
    name: ml-service
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code
        uses: actions/checkout@v5

      - name: Installation de Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Installation des dépendances
        working-directory: services/ml-service
        run: pip install -r requirements.txt

      - name: Vérification syntaxique
        working-directory: services/ml-service
        run: python -m compileall main.py

   # ── Détection des services modifiés ──
  # Construire les sept images à chaque envoi serait disproportionné :
  # on identifie d'abord les dossiers touchés par la modification.
  changements:
    name: détection
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.detecter.outputs.services }}
    steps:
      - name: Récupération du code
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Identification des services touchés
        id: detecter
        run: |
          MODIFIES=$(git diff --name-only HEAD^ HEAD | grep '^services/' | cut -d/ -f2 | sort -u)
          if [ -z "$MODIFIES" ]; then
            echo 'services=[]' >> $GITHUB_OUTPUT
          else
            LISTE=$(echo "$MODIFIES" | jq -R -s -c 'split("\n")[:-1]')
            echo "services=$LISTE" >> $GITHUB_OUTPUT
          fi
          echo "Services modifiés : $MODIFIES"

  # ── Construction des images concernées ──
  images:
    name: image ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: changements
    if: needs.changements.outputs.services != '[]'

    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.changements.outputs.services) }}

    steps:
      - name: Récupération du code
        uses: actions/checkout@v5

      - name: Construction de l'image
        working-directory: services/${{ matrix.service }}
        run: docker build -t smart-orienta-${{ matrix.service }}:${{ github.sha }} .       